<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marija's 26th Birthday</title>
    <meta name="description" content="Marija's 26th Birthday Celebration" />
    <meta name="author" content="Marija Spasova" />

    <meta property="og:title" content="Marija's 26th Birthday" />
    <meta property="og:description" content="Ве поканувам на мојата 26-та роденденска забава! ✨" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/photo1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/photo1.jpg" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
      }

      .bg-image-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        background: black;
      }

      .my-interactive-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%) brightness(0.3);
        transition: transform 1.5s cubic-bezier(0.2, 0, 0.2, 1), filter 2s ease;
        transform: scale(1.1);
      }

      body:hover .my-interactive-img {
        transform: scale(1.02);
        filter: grayscale(30%) brightness(0.4);
      }
    </style>
  </head>

  <body>
    <div class="bg-image-container">
      <img src="/photo1.jpg" alt="Marija" class="my-interactive-img" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
